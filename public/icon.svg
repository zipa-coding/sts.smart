<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="50%" stop-color="#111c34"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2563eb" stroke-width="6" opacity="0.4" />

  <!-- Shield Base -->
  <path d="M256 64 C350 64 394 96 394 96 C394 250 340 370 256 420 C172 370 118 250 118 96 C118 96 162 64 256 64 Z" fill="url(#shieldGrad)" />
  <path d="M256 80 C336 80 376 108 376 108 C376 240 328 348 256 394 C184 348 136 240 136 108 C136 108 176 80 256 80 Z" fill="#0f172a" />

  <!-- Open Book Symbol (Pendidikan) -->
  <path d="M256 260 C230 240 190 236 160 240 L160 320 C190 316 230 320 256 340 C282 320 322 316 352 320 L352 240 C322 236 282 240 256 260 Z" fill="url(#goldGrad)" opacity="0.95" />
  <path d="M256 260 L256 340" stroke="#78350f" stroke-width="4" />

  <!-- Islamic Star / Crescent / Pen Tip (Karakter Islam & Prestasi) -->
  <!-- Central Torch / Star of Knowledge -->
  <polygon points="256,120 268,155 305,155 275,176 286,211 256,189 226,211 237,176 207,155 244,155" fill="url(#goldGrad)" />
  
  <!-- SMART Typography in Icon -->
  <text x="256" y="375" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">SMART</text>
  <text x="256" y="402" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#60a5fa" text-anchor="middle" letter-spacing="2">RAPORT STS</text>
</svg>
